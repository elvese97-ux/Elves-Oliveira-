<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Quiz OBA Nível 3</title>
<style>
body {
    font-family: Arial;
    background: #0b1a2a;
    color: white;
    text-align: center;
    padding: 20px;
}
.quiz-box {
    background: #132f4c;
    padding: 20px;
    border-radius: 10px;
    max-width: 500px;
    margin: auto;
}
button {
    display: block;
    margin: 10px auto;
    padding: 10px;
    width: 100%;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
.correct { background: green; }
.wrong { background: red; }
</style>
</head>

<body>

<div class="quiz-box">
    <h2 id="question">Pergunta</h2>
    <div id="answers"></div>
    <p id="score"></p>
</div>

<script>

const quiz = [
{
    question: "Qual é a causa das fases da Lua?",
    answers: ["Sombra da Terra", "Posição relativa Sol-Terra-Lua", "Rotação da Lua", "Nuvens"],
    correct: 1
},
{
    question: "Por que não ocorre eclipse todo mês?",
    answers: ["Lua é pequena", "Órbita inclinada da Lua", "Sol muda de lugar", "Terra gira rápido"],
    correct: 1
},
{
    question: "Qual movimento causa o dia e a noite?",
    answers: ["Translação", "Rotação", "Gravidade", "Inclinação"],
    correct: 1
},
{
    question: "Qual telescópio usa espelhos?",
    answers: ["Refrator", "Refletor", "Lunar", "Solar"],
    correct: 1
},
{
    question: "Qual estrela é mais quente?",
    answers: ["Vermelha", "Azul", "Amarela", "Laranja"],
    correct: 1
}
];

let current = 0;
let score = 0;

function loadQuestion() {
    const q = quiz[current];
    document.getElementById("question").innerText = q.question;
    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    q.answers.forEach((answer, index) => {
        const btn = document.createElement("button");
        btn.innerText = answer;
        btn.onclick = () => checkAnswer(index);
        answersDiv.appendChild(btn);
    });
}

function checkAnswer(index) {
    if (index === quiz[current].correct) {
        score++;
    }

    current++;

    if (current < quiz.length) {
        loadQuestion();
    } else {
        document.getElementById("question").innerText = "Fim do Quiz!";
        document.getElementById("answers").innerHTML = "";
        document.getElementById("score").innerText = "Pontuação: " + score + "/" + quiz.length;
    }
}

loadQuestion();

</script>

</body>
</html>
